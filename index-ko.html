<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DAMOLDA — 한국어</title>
  <meta name="description" content="DAMOLDA — 조용히 간직되는 것들." />
  <style>
    * { box-sizing: border-box; }

    html[lang="ko"] p,
    html[lang="ko"] h1,
    html[lang="ko"] h2,
    html[lang="ko"] h3,
    html[lang="ko"] a,
    html[lang="ko"] div {
      word-break: keep-all;
      overflow-wrap: normal;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      color: #2b2926;
      overflow-x: hidden;
      font-family: "Iowan Old Style", "Palatino Linotype", "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", Georgia, serif;
    }

    body {
      word-break: keep-all;
      overflow-wrap: normal;
      min-height: 100vh;
      background: #efe0cf;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      overflow: hidden;
    }

    .hero-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: 0;
    }

    .page::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(
        90deg,
        rgba(251, 245, 235, 0.78) 0%,
        rgba(251, 245, 235, 0.52) 31%,
        rgba(251, 245, 235, 0.18) 54%,
        rgba(251, 245, 235, 0.02) 100%
      );
    }

    .site-header,
    .hero-copy {
      position: relative;
      z-index: 2;
    }

    .site-header {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 32px;
      width: 100%;
      padding: 42px 48px 0;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      font-family: "Avenir Next", "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
    }

    .brand {
      justify-self: start;
      font-family: "Iowan Old Style", "Palatino Linotype", "Noto Serif KR", "Apple SD Gothic Neo", "Malgun Gothic", Georgia, serif;
      font-size: 27px;
      letter-spacing: 0.34em;
      font-weight: 700;
      text-decoration: none;
      color: #221f1c;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      justify-self: center;
      gap: 48px;
      min-width: 0;
    }

    .nav a {
      color: #221f1c;
      text-decoration: none;
      white-space: nowrap;
    }

    .hero-copy {
      width: min(620px, calc(100% - 96px));
      margin-left: 9.7vw;
      padding-top: 26vh;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 7vw, 104px);
      line-height: 0.92;
      font-weight: 500;
      letter-spacing: -0.06em;
      color: #2a2927;
    }

    .tagline {
      margin: 26px 0 0;
      font-size: clamp(30px, 2.5vw, 43px);
      line-height: 1.1;
      color: #9b551d;
    }

    .rule {
      width: 72px;
      height: 1px;
      margin: 60px 0 44px;
      background: #9b551d;
    }

    .body-copy {
      max-width: 330px;
      margin: 0;
      font-size: 24px;
      line-height: 1.45;
      color: #2b2926;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 26px;
      margin-top: 58px;
      padding-bottom: 8px;
      border-bottom: 1px solid #9b551d;
      color: #9b551d;
      text-decoration: none;
      font-family: "Avenir Next", "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .cta span {
      font-size: 32px;
      line-height: 1;
      letter-spacing: 0;
      transform: translateY(-1px);
    }

    .lang-switch {
      justify-self: end;
      display: flex;
      gap: 12px;
      align-items: center;
      font-family: "Avenir Next", "Segoe UI", "Apple SD Gothic Neo", "Malgun Gothic", Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #8b6b50;
    }

    .lang-switch a {
      color: #8b6b50;
      text-decoration: none;
      white-space: nowrap;
    }

    .lang-switch a[aria-current="page"] {
      color: #a45f23;
      border-bottom: 1px solid #a45f23;
      padding-bottom: 3px;
    }

    @media (max-width: 900px) {
      .site-header {
        grid-template-columns: auto auto;
        padding: 28px 24px 0;
        gap: 18px;
      }

      .brand { font-size: 20px; }
      .nav { display: none; }

      .hero-bg {
        object-position: 65% center;
      }

      .page::after {
        background: linear-gradient(
          90deg,
          rgba(251, 245, 235, 0.82) 0%,
          rgba(251, 245, 235, 0.56) 46%,
          rgba(251, 245, 235, 0.16) 100%
        );
      }

      .hero-copy {
        width: calc(100% - 48px);
        margin-left: 24px;
        padding-top: 22vh;
      }

      .body-copy { font-size: 20px; }
    }

    @media (max-width: 560px) {
      .hero-bg { object-position: 70% center; }
      .brand { font-size: 20px; letter-spacing: 0.25em; }
      .hero-copy { padding-top: 20vh; }
      .rule { margin: 44px 0 34px; }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="DAMOLDA landing page">
    <img class="hero-bg" src="assets/hero.png" alt="Warm interior scene with a wooden console table in sunlight" />

    <header class="site-header" aria-label="Site header">
      <a class="brand" href="./index.html">DAMOLDA</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="./about-ko.html">About</a>
        <a href="./collections-ko.html">Collections</a>
        <a href="./journal-ko.html">Journal</a>
      </nav>
      <div class="lang-switch" aria-label="언어 전환">
        <a href="./index-ko.html" aria-current="page">한국어</a>
        <span>|</span>
        <a href="./index.html">EN</a>
      </div>
    </header>

    <section class="hero-copy" aria-label="Hero copy">
      <h1>Quietly kept.</h1>
      <p class="tagline">Keep what matters.</p>
      <div class="rule" aria-hidden="true"></div>
      <p class="body-copy">남길 것을 고르고, 그것이 머물 자리를 만들어 주세요.</p>
      <a class="cta" href="./collections-ko.html">Explore <span aria-hidden="true">→</span></a>
    </section>

  </main>

  <script>
    document.querySelectorAll('a[href="./collections.html"], a[href="collections.html"]').forEach(function(link) {
      link.addEventListener('click', function(event) {
        event.preventDefault();
        window.location.href = './collections-ko.html';
      });
    });
  </script>
</body>
</html>
