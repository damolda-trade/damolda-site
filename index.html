<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DAMOLDA</title>
  <meta name="description" content="DAMOLDA — quietly kept, keep what matters." />
  <style>
    :root {
      --bg-a: #fbf5eb;
      --bg-b: #ead3b8;
      --bg-c: #f7efe5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 82% 8%, rgba(255, 242, 222, 0.95) 0%, rgba(255, 242, 222, 0.45) 28%, transparent 55%),
        linear-gradient(115deg, var(--bg-a) 0%, var(--bg-c) 42%, var(--bg-b) 100%);
      color: #2b2926;
    }

    body {
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      min-height: 100vh;
    }

    .hero-image {
      display: block;
      width: 100%;
      height: auto;
      min-height: 100vh;
      object-fit: contain;
      object-position: top center;
    }

    @media (max-width: 760px) {
      .hero-image {
        width: 170%;
        max-width: none;
        transform: translateX(-21%);
      }
    }
  </style>
</head>
<body>
  <main class="page" aria-label="DAMOLDA landing page">
    <img class="hero-image" src="assets/hero.png" alt="DAMOLDA quietly kept landing page with warm interior console table styling" />
  </main>
</body>
</html>
