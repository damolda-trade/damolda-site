<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DAMOLDA</title>
  <meta name="description" content="DAMOLDA — Quietly kept. Keep what matters." />
  <style>
    :root {
      --bg: #f3eee7;
      --paper: #fbf8f2;
      --ink: #2c2722;
      --muted: #6d6258;
      --gold: #b1844b;
      --line: rgba(177, 132, 75, 0.55);
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: linear-gradient(90deg, var(--paper) 0%, var(--paper) 44%, var(--bg) 44%, var(--bg) 100%);
    }

    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100vh;
      padding: 42px 5vw 56px;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--muted);
      position: relative;
      z-index: 2;
    }

    .logo {
      justify-self: start;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      font-size: 24px;
      letter-spacing: 0.24em;
      font-weight: 600;
    }

    .nav {
      display: flex;
      gap: 48px;
      align-items: center;
      white-space: nowrap;
    }

    .soon {
      justify-self: end;
      color: var(--gold);
      white-space: nowrap;
    }

    .hero {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(380px, 43%) 1fr;
      gap: 5vw;
      align-items: center;
      padding-top: 58px;
    }

    .copy {
      padding-left: 4vw;
      max-width: 620px;
    }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(62px, 5.2vw, 88px);
      line-height: 0.98;
      letter-spacing: -0.055em;
      font-weight: 500;
      white-space: nowrap;
    }

    .tagline {
      margin: 0;
      color: var(--gold);
      font-size: clamp(25px, 2.1vw, 36px);
      line-height: 1.15;
    }

    .rule {
      width: 68px;
      height: 1px;
      background: var(--line);
      margin: 54px 0 38px;
    }

    .description {
      margin: 0;
      max-width: 340px;
      color: #4f463f;
      font-size: 23px;
      line-height: 1.6;
    }

    .cta {
      margin-top: 54px;
      display: inline-flex;
      align-items: center;
      gap: 30px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--gold);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 13px;
      font-weight: 600;
    }

    .cta::after {
      content: "";
      width: 56px;
      height: 1px;
      background: var(--line);
      display: block;
    }

    .image-wrap {
      align-self: stretch;
      min-height: 620px;
      overflow: hidden;
      background: #e8dfd4;
    }

    .image-wrap img {
      width: 100%;
      height: 100%;
      min-height: 620px;
      display: block;
      object-fit: cover;
      object-position: center center;
    }

    @media (max-width: 980px) {
      body { background: var(--paper); }
      .page { padding: 28px 24px 40px; }
      .header { grid-template-columns: 1fr auto; }
      .nav { display: none; }
      .soon { font-size: 11px; }
      .hero {
        grid-template-columns: 1fr;
        gap: 42px;
        padding-top: 56px;
      }
      .copy { padding-left: 0; }
      h1 { font-size: clamp(48px, 12vw, 72px); white-space: normal; }
      .image-wrap { min-height: 420px; }
      .image-wrap img { min-height: 420px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header" aria-label="Site header">
      <a class="logo" href="#" aria-label="DAMOLDA home">DAMOLDA</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="#about">About</a>
        <a href="#collections">Collections</a>
        <a href="#journal">Journal</a>
      </nav>
      <span class="soon">Coming Soon</span>
    </header>

    <section class="hero" aria-label="DAMOLDA landing hero">
      <div class="copy">
        <h1>Quietly kept.</h1>
        <p class="tagline">Keep what matters.</p>
        <div class="rule" aria-hidden="true"></div>
        <p class="description">Choose what stays, and give it a place in the room.</p>
        <a class="cta" href="#collections">Explore</a>
      </div>

      <figure class="image-wrap" aria-label="A softly lit table with quiet keepsake objects">
        <img src="assets/hero.png" alt="A softly lit wooden table with quiet keepsake objects" />
      </figure>
    </section>
  </main>
</body>
</html>
