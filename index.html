<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DAMOLDA</title>
  <meta name="description" content="DAMOLDA — Quietly kept. Keep what matters." />
  <style>
    :root {
      --ink: #29231f;
      --muted: #6f6258;
      --gold: #a86f35;
      --line: rgba(168, 111, 53, 0.52);
      --cream: #fbf6ef;
      --warm: #ead8c6;
      --peach: #f4dfc8;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }

    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 18%, rgba(255,255,255,0.95) 0, rgba(255,255,255,0.35) 22%, transparent 46%),
        linear-gradient(115deg, var(--cream) 0%, #f6eadc 42%, var(--warm) 74%, var(--peach) 100%);
    }

    a { color: inherit; text-decoration: none; }

    .page {
      min-height: 100vh;
      padding: 42px 5vw 64px;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--muted);
      position: relative;
      z-index: 2;
    }

    .logo {
      justify-self: start;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      font-size: 24px;
      letter-spacing: 0.25em;
      font-weight: 600;
    }

    .nav {
      display: flex;
      gap: 52px;
      align-items: center;
      white-space: nowrap;
    }

    .soon {
      justify-self: end;
      color: var(--gold);
      white-space: nowrap;
    }

    .hero {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(390px, 42%) minmax(0, 1fr);
      gap: 5vw;
      align-items: center;
      padding-top: 72px;
    }

    .copy {
      padding-left: 4vw;
      max-width: 650px;
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0 0 22px;
      font-size: clamp(60px, 5.4vw, 92px);
      line-height: 0.98;
      letter-spacing: -0.055em;
      font-weight: 500;
      white-space: nowrap;
    }

    .tagline {
      margin: 0;
      color: var(--gold);
      font-size: clamp(25px, 2.1vw, 36px);
      line-height: 1.15;
    }

    .rule {
      width: 70px;
      height: 1px;
      background: var(--line);
      margin: 54px 0 38px;
    }

    .description {
      margin: 0;
      max-width: 355px;
      color: #4d443d;
      font-size: 23px;
      line-height: 1.6;
    }

    .cta {
      margin-top: 54px;
      display: inline-flex;
      align-items: center;
      gap: 24px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--gold);
      letter-spacing: 0.22em;
      text-transform: uppercase;
      font-size: 13px;
      font-weight: 600;
    }

    .cta::after {
      content: "→";
      font-size: 24px;
      line-height: 1;
      letter-spacing: 0;
      transform: translateY(-1px);
    }

    .image-wrap {
      margin: 0;
      width: 100%;
      align-self: center;
      overflow: visible;
    }

    .image-wrap img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      filter: drop-shadow(0 24px 44px rgba(82, 55, 34, 0.12));
    }

    @media (max-width: 980px) {
      .page { padding: 28px 24px 42px; }
      .header { grid-template-columns: 1fr auto; }
      .nav { display: none; }
      .soon { font-size: 11px; }
      .hero {
        grid-template-columns: 1fr;
        gap: 42px;
        padding-top: 56px;
      }
      .copy { padding-left: 0; }
      h1 { font-size: clamp(48px, 12vw, 72px); white-space: normal; }
      .image-wrap { max-width: 760px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="header" aria-label="Site header">
      <a class="logo" href="#" aria-label="DAMOLDA home">DAMOLDA</a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="#about">About</a>
        <a href="#collections">Collections</a>
        <a href="#journal">Journal</a>
      </nav>
      <span class="soon">Coming Soon</span>
    </header>

    <section class="hero" aria-label="DAMOLDA landing hero">
      <div class="copy">
        <h1>Quietly kept.</h1>
        <p class="tagline">Keep what matters.</p>
        <div class="rule" aria-hidden="true"></div>
        <p class="description">Choose what stays, and give it a place in the room.</p>
        <a class="cta" href="#collections">Explore</a>
      </div>

      <figure class="image-wrap" aria-label="A softly lit table with quiet keepsake objects">
        <img src="assets/hero.png" alt="A softly lit wooden console table with quiet keepsake objects" />
      </figure>
    </section>
  </main>
</body>
</html>
