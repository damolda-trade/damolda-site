<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DAMOLDA</title>

  <style>
    :root {
      --bg: #f6f0e8;
      --paper: #fbf7f1;
      --text: #2d261f;
      --muted: #7b6b5a;
      --gold: #b28a55;
      --line: rgba(178, 138, 85, 0.45);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 18% 18%, rgba(255, 255, 255, 0.78), transparent 36%),
        linear-gradient(115deg, var(--paper) 0%, #f4eee6 48%, #e8dcca 100%);
    }

    .nav {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 34px 5vw 0;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 24px;
      font-family: Arial, Helvetica, sans-serif;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 13px;
    }

    .brand {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      letter-spacing: 0.18em;
      color: var(--text);
      text-decoration: none;
      white-space: nowrap;
    }

    .links {
      display: flex;
      gap: 42px;
      align-items: center;
      justify-content: center;
    }

    .links a,
    .soon {
      color: var(--text);
      text-decoration: none;
      opacity: 0.86;
    }

    .soon {
      justify-self: end;
      color: var(--gold);
      white-space: nowrap;
    }

    .hero {
      flex: 1;
      display: grid;
      grid-template-columns: minmax(320px, 0.9fr) minmax(420px, 1.25fr);
      align-items: center;
      gap: 42px;
      padding: 56px 5vw 72px;
    }

    .copy {
      position: relative;
      z-index: 2;
      max-width: 560px;
      padding-left: 4vw;
    }

    h1 {
      margin: 0;
      font-weight: 400;
      font-size: clamp(56px, 7vw, 104px);
      line-height: 0.96;
      letter-spacing: 0.01em;
    }

    .tagline {
      margin: 22px 0 0;
      font-size: clamp(26px, 3vw, 43px);
      line-height: 1.18;
      color: var(--gold);
      letter-spacing: 0.03em;
    }

    .rule {
      width: 74px;
      height: 1px;
      margin: 54px 0 38px;
      background: var(--gold);
    }

    .subcopy {
      max-width: 390px;
      margin: 0;
      font-size: clamp(19px, 1.6vw, 25px);
      line-height: 1.6;
      color: var(--muted);
    }

    .cta {
      display: inline-flex;
      align-items: center;
      gap: 28px;
      margin-top: 54px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
      text-decoration: none;
    }

    .cta::after {
      content: "";
      width: 58px;
      height: 1px;
      background: var(--gold);
      display: inline-block;
    }

    .visual {
      position: relative;
      min-height: 610px;
      align-self: stretch;
      border-radius: 0;
      overflow: hidden;
      box-shadow: none;
    }

    .visual img {
      width: 100%;
      height: 100%;
      min-height: 610px;
      display: block;
      object-fit: cover;
      object-position: center right;
      filter: saturate(0.92) contrast(0.96);
    }

    .visual::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(246, 240, 232, 0.74) 0%, rgba(246, 240, 232, 0.2) 38%, transparent 72%),
        radial-gradient(circle at 70% 48%, transparent 0%, rgba(246, 240, 232, 0.06) 44%, rgba(246, 240, 232, 0.28) 100%);
      pointer-events: none;
    }

    .visual::after {
      content: "";
      position: absolute;
      inset: 0;
      backdrop-filter: blur(0.2px);
      pointer-events: none;
    }

    @media (max-width: 980px) {
      .nav {
        grid-template-columns: 1fr auto;
        padding-top: 28px;
      }

      .links {
        display: none;
      }

      .soon {
        font-size: 12px;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 38px;
        padding: 62px 7vw 56px;
      }

      .copy {
        padding-left: 0;
      }

      .visual {
        min-height: 390px;
        order: 2;
      }

      .visual img {
        min-height: 390px;
        object-position: center;
      }

      .rule {
        margin: 36px 0 28px;
      }

      .cta {
        margin-top: 38px;
      }
    }

    @media (max-width: 560px) {
      .nav {
        padding: 24px 22px 0;
      }

      .brand {
        font-size: 20px;
      }

      .soon {
        font-size: 11px;
        letter-spacing: 0.12em;
      }

      .hero {
        padding: 54px 22px 42px;
      }

      h1 {
        font-size: 52px;
      }

      .tagline {
        font-size: 26px;
      }

      .subcopy {
        font-size: 18px;
      }

      .visual {
        min-height: 310px;
      }

      .visual img {
        min-height: 310px;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="nav" aria-label="Main navigation">
      <a class="brand" href="/" aria-label="DAMOLDA home">DAMOLDA</a>

      <nav class="links" aria-label="Primary">
        <a href="#about">About</a>
        <a href="#collections">Collections</a>
        <a href="#journal">Journal</a>
      </nav>

      <div class="soon">Coming Soon</div>
    </header>

    <section class="hero" aria-label="DAMOLDA landing hero">
      <div class="copy">
        <h1>Quietly kept.</h1>
        <p class="tagline">Keep what matters.</p>

        <div class="rule" aria-hidden="true"></div>

        <p class="subcopy">
          Choose what stays, and give it a place in the room.
        </p>

        <a class="cta" href="#collections">Explore</a>
      </div>

      <div class="visual" aria-hidden="true">
        <img src="./hero.png" alt="" />
      </div>
    </section>
  </main>
</body>
</html>
